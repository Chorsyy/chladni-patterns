<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chladni Patterns Real-time Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; font-size: 24px; color: #fff; }
        .controls {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px 15px;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }
        label { font-weight: bold; font-size: 14px; }
        input[type=range] { width: 100%; }
        span { font-variant-numeric: tabular-nums; font-size: 14px; width: 30px; text-align: right; }
        #canvas-container {
            border: 2px solid #444;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            max-width: 500px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Chladniho Vzorce (Real-time)</h1>
    
    <div class="controls">
        <label for="n-slider">Mód n:</label>
        <input type="range" id="n-slider" min="1" max="15" step="1" value="2">
        <span id="n-val">2</span>
        
        <label for="m-slider">Mód m:</label>
        <input type="range" id="m-slider" min="1" max="15" step="1" value="7">
        <span id="m-val">7</span>
        
        <label for="a-slider">Váha a:</label>
        <input type="range" id="a-slider" min="-1" max="1" step="0.1" value="1">
        <span id="a-val">1.0</span>
        
        <label for="b-slider">Váha b:</label>
        <input type="range" id="b-slider" min="-1" max="1" step="0.1" value="1">
        <span id="b-val">1.0</span>
    </div>

    <div id="canvas-container"></div>
    
    <div class="info">
        Rovnica: W(x, y) = a * sin(nπx) * sin(mπy) + b * sin(mπx) * sin(nπy) <br>
        Svetlé línie znázorňujú miesta (uzly), kde je kmitanie nulové a usadzuje sa tam piesok.
    </div>

    <script>
        let nSlider, mSlider, aSlider, bSlider;
        let nVal, mVal, aVal, bVal;
        const size = 400;

        function setup() {
            const canvas = createCanvas(size, size);
            canvas.parent('canvas-container');
            pixelDensity(1);
            
            nSlider = select('#n-slider');
            mSlider = select('#m-slider');
            aSlider = select('#a-slider');
            bSlider = select('#b-slider');
            
            nVal = select('#n-val');
            mVal = select('#m-val');
            aVal = select('#a-val');
            bVal = select('#b-val');
        }

        function draw() {
            let n = float(nSlider.value());
            let m = float(mSlider.value());
            let a = float(aSlider.value());
            let b = float(bSlider.value());
            
            nVal.html(n);
            mVal.html(m);
            aVal.html(a.toFixed(1));
            bVal.html(b.toFixed(1));

            loadPixels();
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    // Normalizácia súradníc na rozsah 0 až 1
                    let nx = x / width;
                    let ny = y / height;
                    
                    // Výpočet Chladniho rovnice
                    let w = a * sin(n * PI * nx) * sin(m * PI * ny) + b * sin(m * PI * nx) * sin(n * PI * ny);
                    
                    // Čím bližšie k nule (uzol), tým svetlejšia farba (piesok)
                    let absW = abs(w);
                    let intensity = map(absW, 0, 0.2, 255, 0, true);
                    
                    // Nastavenie farby pixelu (medený/pieskový odtieň)
                    let index = (x + y * width) * 4;
                    pixels[index] = intensity;       // R
                    pixels[index + 1] = intensity * 0.7; // G
                    pixels[index + 2] = intensity * 0.4; // B
                    pixels[index + 3] = 255;             // A
                }
            }
            
            updatePixels();
        }
    </script>
</body>
</html>
